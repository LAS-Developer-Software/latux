<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        font-family: sans-serif;
      }
      .frame {
        width: min(80%, 720px);
        aspect-ratio: 3 / 4;
        border: 1px solid #cbd5e1;
        background: white;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 600;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="frame">LaTeX PDF Preview</div>
  </body>
</html>
