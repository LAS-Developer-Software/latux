<html>
<body style="margin:0;padding:10px;font-family:sans-serif;">
    <textarea id="code" style="width:100%;height:80%;font-size:16px;"></textarea>
    <button onclick="send()">Insert</button>

    <script>
        const vscode = acquireVsCodeApi();
        function send() {
            vscode.postMessage({ command: 'insert', text: document.getElementById('code').value });
        }
    </script>
</body>
</html>
